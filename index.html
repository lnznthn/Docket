<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F3F4F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111418" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Docket">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<title>Docket</title>
<style>
/* Shared look 1: identical text in Team HQ, Docket and Ledger. Change all three repos together; each test checks this block's hash. */
@font-face{font-family:Inter;font-weight:400;font-display:swap;src:url(fonts/inter-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:Inter;font-weight:500;font-display:swap;src:url(fonts/inter-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:Inter;font-weight:600;font-display:swap;src:url(fonts/inter-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:Inter;font-weight:700;font-display:swap;src:url(fonts/inter-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Space Grotesk";font-weight:700;font-display:swap;src:url(fonts/space-grotesk-latin-700-normal.woff2) format("woff2")}
:root{--ground:#F3F4F6;--surface:#FFFFFF;--well:#E4E7EB;--ink:#14171C;--muted:#5B6472;--edge:#808998;--line:#D9DDE3;--line-soft:#EEF0F3;
--accent:#1D4ED8;--accent-fill:#1D4ED8;--on-accent:#FFFFFF;--sel:#14171C;--on-sel:#FFFFFF;--tint:#EEF3FF;--tint-line:#C9D6FB;--tint-ink:#1E3A8A;
--ok:#17794A;--warn:#B4460F;--danger:#B3261E;--inv:#14171C;--on-inv:#FFFFFF;--scrim:rgba(20,23,28,.4);--float:0 4px 12px rgba(20,23,28,.28);
--sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--display:"Space Grotesk",Inter,system-ui,sans-serif;
--num:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
--t-label:12px;--t-body:14px;--t-field:16px;--t-head:18px;--t-title:22px;
--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--r-s:6px;--r-m:10px;--r-l:16px;--r-pill:999px;--tap:44px;--tap-fine:36px;
--sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom);color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--ground:#111418;--surface:#1B1F26;--well:#23272F;--ink:#E8EAED;--muted:#A3ACB9;--edge:#667080;--line:#2F3540;--line-soft:#252A32;
--accent:#7DB0FF;--accent-fill:#2B66F6;--on-accent:#FFFFFF;--sel:#2B66F6;--on-sel:#FFFFFF;--tint:#1E2A44;--tint-line:#34497A;--tint-ink:#BBD0FF;
--ok:#4FD39C;--warn:#F29A5C;--danger:#FF6B6B;--inv:#E8EAED;--on-inv:#14171C;--scrim:rgba(0,0,0,.6)}}
@media (min-width:900px){:root{--t-title:26px}}
html.embed{--sat:0px;--sab:0px}
/* end shared look */
:root{--bg:var(--ground);--card:var(--surface);--mut:var(--muted);--line2:var(--line-soft);--blue:var(--accent);--hot:var(--warn);--seg:var(--well);--selfg:var(--on-sel);--invfg:var(--on-inv);--done:var(--accent-fill);--tintb:var(--tint-line);--tintfg:var(--tint-ink);--dash:#6B7480;--c1:#7986CB;--c2:#2C9E69;--c3:#8E24AA;--c5:#AC861B;--c6:#F4511E;--c8:#616161;--c9:#3F51B5;--c11:#D50000}
@media (prefers-color-scheme:dark){:root{--dash:#7A8492;--c1:#7986CB;--c2:#33B679;--c3:#A550BB;--c5:#F6BF26;--c6:#F4511E;--c8:#747474;--c9:#5E6DC1;--c11:#DC2B2B}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:var(--t-body)/1.3 var(--sans);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;margin:0}
input,textarea,select{font:inherit;color:var(--ink)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
h1,h2,h3,p{margin:0}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden}
.park{position:absolute;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;background:var(--bg);text-align:center}
.side{display:none}
.shell{flex:1;min-height:0;min-width:0;display:flex;flex-direction:column}
.hdr{padding:calc(var(--sat) + 12px) 16px 8px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.hdr h1{font:700 22px/1.1 "Space Grotesk",Inter,sans-serif}
.hdr .sub{min-width:0;flex:1;text-align:right;font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat{flex:none;min-height:32px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);font-size:12px;font-weight:600;color:var(--mut)}
.stat.bad{color:var(--hot);border-color:var(--hot)}
.selb{flex:none;position:relative;min-height:32px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);font-size:12px;font-weight:600;color:var(--mut)}
.selb::after{content:"";position:absolute;inset:-6px 0}
.selb.on{border-color:var(--sel);background:var(--sel);color:var(--selfg)}
.box{width:18px;height:18px;border-radius:4px;border:2px solid var(--ink);background:var(--card);display:flex;align-items:center;justify-content:center}
.box svg{display:none}.box.on{border-color:var(--sel);background:var(--sel)}.box.on svg{display:block}
.row.picked{background:var(--tint)}
.selall{position:relative;margin-left:8px;padding:0;border:0;background:none;color:var(--blue);font-size:12px;font-weight:600}
.selall::after{content:"";position:absolute;inset:-12px -8px}
.bulk{flex:none;display:flex;flex-direction:column;gap:8px;padding:8px 12px calc(var(--sab) + 8px);background:var(--card);border-top:1px solid var(--line)}
.bl{display:flex;align-items:center;gap:8px}
.bl b{flex:1;min-width:0;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bulk select{flex:1 1 auto;min-width:0;height:44px;padding:0 4px;border:1px solid var(--edge);border-radius:8px;background:var(--card);font-size:14px}
.bulk select:disabled,.bulk .mini:disabled{opacity:.45}
.toast.up{bottom:calc(var(--sab) + 132px)}
.main{flex:1;min-height:0;overflow-y:auto;padding:4px 12px 24px;-webkit-overflow-scrolling:touch}
.col{display:flex;flex-direction:column;gap:8px;min-width:0}
.cols{display:block}
.cols>.col+.col{margin-top:8px}
.coltitle{display:none}
.sec{display:flex;flex-direction:column}
.sec>.sh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:8px 4px 4px}
.sec>.sh h2{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--mut)}
.sec>.sh span{font-size:12px;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.row{position:relative;display:flex;align-items:center;min-height:44px;padding-right:12px;border-bottom:1px solid var(--line2);background:var(--card)}
.row:last-child{border-bottom:0}
.cbar{position:absolute;left:0;top:0;bottom:0;width:3px;pointer-events:none}
.cb1{background:var(--c1)}.cb2{background:var(--c2)}.cb3{background:var(--c3)}.cb5{background:var(--c5)}.cb6{background:var(--c6)}.cb8{background:var(--c8)}.cb9{background:var(--c9)}.cb11{background:var(--c11)}

.row.wait{background:var(--bg)}
.lead{flex:none;width:44px;height:44px;padding:0;border:0;background:none;display:flex;align-items:center;justify-content:center}
.ring{width:18px;height:18px;border-radius:50%;border:2px solid var(--ink);background:var(--card);display:flex;align-items:center;justify-content:center}
.ring.prio{border-color:var(--hot)}
.ring.arch{border-color:var(--edge)}
.ring.drop{border:2px dashed var(--dash)}
.ring.done{border-color:var(--done);background:var(--done)}
.ring svg{display:none}
.ring.done svg{display:block}
.num{width:18px;height:18px;border-radius:50%;border:2px dashed var(--dash);font:600 10px/14px Inter,sans-serif;color:var(--mut);text-align:center;font-style:normal}
.sq{width:8px;height:8px;border-radius:2px;background:var(--ink)}
.chev{color:var(--blue)}
.more,.okb,.stat{position:relative}
.more::after{content:"";position:absolute;inset:-6px -4px}.okb::after{content:"";position:absolute;inset:-4px 0}.stat::after{content:"";position:absolute;inset:-6px 0}
.more{flex:none;min-width:36px;height:32px;margin:0 8px 0 4px;padding:0 8px;border:1px solid var(--tintb);border-radius:8px;background:var(--tint);color:var(--tintfg);font-size:12px;font-weight:700}
.body{flex:1;min-width:0;min-height:44px;padding:4px 0;border:0;background:none;display:flex;align-items:center;text-align:left}
.when{flex:none;margin-right:8px;font-size:12px;font-weight:600;color:var(--mut)}
.when.hot{color:var(--hot)}
.ttl{flex:0 1 auto;min-width:0;font-size:14px;line-height:18px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrap .ttl{white-space:normal;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2}
.off .ttl{color:var(--mut);text-decoration:line-through}
.wait .ttl{color:var(--mut)}
.m2{flex:0 1000000 auto;min-width:0;margin-left:auto;padding-left:12px;height:16px;overflow:hidden;display:flex;flex-wrap:wrap;justify-content:flex-end;font-size:12px;line-height:16px;color:var(--mut)}
.m2 i{flex:none;width:1px;height:16px}
.m2 span{flex:none;white-space:nowrap}
.m1{flex:none;max-width:33%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;color:var(--mut)}
.m2:empty+.m1,.nom2 .m1{margin-left:auto;padding-left:12px}
.gss .m1,.gss .m2 span{text-decoration:underline dashed}
.okb{flex:none;min-width:44px;height:36px;margin-left:8px;padding:0 8px;border:1px solid var(--ink);border-radius:8px;background:var(--card);font-size:12px;font-weight:600}
.sug{display:flex;align-items:center;gap:8px;min-height:52px;padding:4px 4px 4px 12px;background:var(--card);border:1px dashed var(--dash);border-radius:10px}
.sug>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.sug small{font-size:12px;color:var(--mut)}
.sug .btn{padding:0 12px}
.sug b{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{flex:none;min-height:44px;padding:0 16px;border:1px solid var(--dash);border-radius:10px;background:var(--card);font-size:14px;font-weight:600}
.btn.pri{border-color:var(--done);background:var(--done);color:#fff}
.btn.dark{border-color:var(--sel);background:var(--sel);color:var(--selfg)}
.btn.sm{min-height:44px;padding:0 12px}
.ctl{display:flex;gap:8px;align-items:stretch}
.segs{flex:3;min-width:0;display:flex;gap:4px;background:var(--seg);border-radius:10px;padding:4px}
.sheet>.segs{flex:none}
.segs button{flex:1;min-width:0;min-height:44px;padding:0 4px;border:0;border-radius:8px;background:transparent;font-size:13px;font-weight:600}
.segs button.on{background:var(--sel);color:var(--selfg)}
.fbtn{flex:1.3;min-width:0;min-height:52px;padding:0 8px;border:1px solid var(--edge);border-radius:10px;background:var(--card);font-size:13px;font-weight:600}
.fbtn.on{border-color:var(--sel);background:var(--sel);color:var(--selfg)}
.fpanel{background:var(--card);border:1px solid var(--ink);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:12px}
.fpanel>div{display:flex;align-items:center;gap:8px}
.cap{font-size:10px;line-height:1.2;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--mut)}
.fpanel .cap{flex:none;width:48px}
#guess{gap:4px}
.chips{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 12px;border:1px solid var(--edge);border-radius:999px;background:var(--card);font-size:12px;font-weight:600}
.chip.on{border-color:var(--sel);background:var(--sel);color:var(--selfg)}
.note{font-size:12px;color:var(--mut);padding:0 4px}
.empty{display:flex;align-items:center;gap:8px;padding:4px 4px 4px 12px;background:var(--card);border:1px dashed var(--dash);border-radius:10px;font-size:13px;min-height:52px}
.empty>span{flex:1;min-width:0}
.find{display:flex;align-items:center;gap:8px}
.find label{flex:none;font-size:12px;color:var(--mut);padding-left:4px}
.fld{min-height:44px;width:100%;padding:0 12px;border:1px solid var(--edge);border-radius:10px;background:var(--card);font-size:14px}
textarea.fld{padding:8px 12px;line-height:1.4;resize:none}
.tabs{flex:none;position:relative;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:var(--sab)}
.tabs[hidden]{display:none}
.tabs>button{flex:1;min-height:56px;padding:0;border:0;border-top:3px solid transparent;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:600;color:var(--mut)}
.tabs>button.on{color:var(--blue);border-top-color:var(--blue)}
.plusw{flex:none;width:72px;display:flex;align-items:flex-start;justify-content:center}
.plus{width:52px;height:52px;margin-top:-16px;padding:0;border:3px solid var(--card);border-radius:50%;background:var(--sel);color:var(--selfg);display:flex;align-items:center;justify-content:center}
.scrim{position:absolute;inset:0;width:100%;height:100%;padding:0;border:0;background:var(--scrim);z-index:5}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:6;padding:16px 16px calc(var(--sab) + 16px);background:var(--card);border-radius:16px 16px 0 0;display:flex;flex-direction:column;gap:8px}
.sheet.tall{top:calc(var(--sat) + 56px);overflow-y:auto}
.toast{position:absolute;left:12px;right:12px;bottom:calc(var(--sab) + 80px);z-index:4;min-height:44px;padding:0 0 0 12px;background:var(--inv);color:var(--invfg);border-radius:10px;display:flex;align-items:center;gap:8px;box-shadow:0 4px 12px rgba(20,23,28,.28)}
.toast span{flex:1;min-width:0;font-size:13px;max-height:2.6em;overflow:hidden}
.toast button{flex:none;min-height:44px;min-width:44px;padding:0 12px;border:0;background:none;color:var(--invfg);font-size:13px;font-weight:700;text-decoration:underline}
.toast button.x{text-decoration:none;display:flex;align-items:center;justify-content:center}
.inl{padding:8px 12px 12px;background:var(--bg);border-bottom:1px solid var(--line);box-shadow:inset 4px 0 0 var(--sel);display:flex;flex-direction:column;gap:8px}
.il{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
.il label{display:inline-flex;align-items:center;gap:4px;min-height:44px;font-size:12px;color:var(--mut);white-space:nowrap}
.il input[type=checkbox],.il input[type=radio]{margin:0;width:16px;height:16px}
.il .grp{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.draft{font-size:16px}
.il select,.il input[type=text],.il input[type=date],.il input[type=time]{height:44px;min-width:0;padding:0 8px;border:1px solid var(--edge);border-radius:6px;background:var(--card);font-size:13px}
.il .grow{flex:1 1 160px;min-width:0}
.il label.grow select,.il label.grow input{flex:1 1 auto}
.mini{height:44px;padding:0 12px;border:1px solid var(--edge);border-radius:6px;background:var(--card);font-size:12px;font-weight:600}
.il .info{flex:1 1 240px;min-width:0;font-size:12px;color:var(--mut)}
.il .mini[data-a=close]{margin-left:auto}
.inl textarea{width:100%;min-height:48px;field-sizing:content;max-height:160px;padding:8px;border:1px solid var(--edge);border-radius:6px;background:var(--card);font-size:13px;line-height:1.4;resize:vertical}
.row.cur{box-shadow:inset 4px 0 0 var(--sel)}
.row.cur .body{cursor:pointer}
.row.cur .m2{display:none}
.row.cur .m1{flex:0 1 auto;min-width:0;margin-left:auto;padding-left:12px}
.rowin{flex:1 1 auto;min-width:88px;height:36px;padding:0 8px;border:1px solid var(--edge);border-radius:8px;background:var(--card);font-size:14px;font-weight:500;text-overflow:ellipsis}
.inl .dhead .lead{margin-left:0}
.drow{display:flex;gap:8px}
.evt{flex:1;min-width:0;padding:12px 4px 0;font-size:14px;line-height:1.3;font-weight:600}
.evw{font-size:14px;line-height:1.4}
#detail .find label{padding-left:0}
#detail .cap,.set .cap{font-size:12px;line-height:1.3;font-weight:400;letter-spacing:0;text-transform:none}
#detail .trait b{font-size:14px;font-weight:400}
#detail .dhead textarea{font-size:14px}
#detail .btn,#detail .day,#detail .calb,#detail .segs button,#detail .alist button{font-size:14px}
#detail .band p,#detail .note{font-size:12px}
.dhead{display:flex;align-items:flex-start;gap:8px}
.dhead .lead{width:44px;height:44px;margin-left:-8px}
.dhead .ring{width:22px;height:22px}
.dhead textarea{flex:1;min-width:0;padding:12px;border:1px solid var(--edge);border-radius:10px;background:var(--card);font-size:15px;line-height:18px;font-weight:600;resize:none}
.xbtn{flex:none;width:44px;height:44px;margin-right:-8px;padding:0;border:0;background:none;display:flex;align-items:center;justify-content:center}
.band{min-height:44px;display:flex;align-items:center;gap:8px}
.band p{flex:1;min-width:0;font-size:12px;line-height:15px;color:var(--mut)}
.trait{flex:1;min-width:0;min-height:44px;padding:4px 12px;border:1px solid var(--edge);border-radius:10px;background:var(--card);display:flex;align-items:center;gap:8px;text-align:left}
.trait .cap{flex:none;color:var(--mut)}
.drow>.trait{flex-direction:column;align-items:flex-start;justify-content:center;gap:0}
.trait.on{border-color:var(--sel);box-shadow:inset 0 0 0 1px var(--sel)}
.trait b{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.lab{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.day{flex:1;min-width:0;min-height:44px;padding:0 4px;border:1px solid var(--edge);border-radius:999px;background:var(--card);font-size:13px;font-weight:600}
.day.on{border-color:var(--sel);background:var(--sel);color:var(--selfg)}
.calb{min-height:44px;padding:8px 12px;line-height:18px;border:1px solid var(--edge);border-radius:10px;background:var(--card);font-size:13px;font-weight:600;text-align:left}
.calb.on{border-color:var(--sel);background:var(--sel);color:var(--selfg)}
.calb.no{border-style:dashed;color:var(--mut)}
.alist{flex:1 1 204px;min-height:160px;overflow-y:auto;border:1px solid var(--ink);border-radius:10px;display:flex;flex-direction:column}
.alist button{flex:none;min-height:44px;padding:0 12px;border:0;border-bottom:1px solid var(--line2);background:var(--card);font-size:13px;font-weight:500;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alist button.on{background:var(--sel);color:var(--selfg)}
.notes{flex:1 1 auto;min-height:96px;display:flex;flex-direction:column;gap:4px}
.notes textarea{flex:1 1 auto}
.foot{display:flex;gap:8px}
.foot .btn{flex:1}
.foot .btn.dark{flex:2}
.gchip{min-height:44px;padding:0 12px;border:1px solid var(--ink);border-radius:999px;background:var(--card);font-size:13px;font-weight:600}
.set h2{font:700 18px/1.2 "Space Grotesk",Inter,sans-serif}
.set p,.set li{font-size:13px;line-height:1.45;color:var(--ink)}
.set ol{margin:0;padding-left:20px}
.set .warnbox{border:1px solid var(--hot);border-radius:10px;padding:8px 12px;color:var(--hot);font-size:13px}
@media (min-width:900px){
#app{flex-direction:row}
.side{display:flex;flex:none;width:200px;padding:16px 12px;background:var(--card);border-right:1px solid var(--line);flex-direction:column;gap:16px}
.side .logo{font:700 22px/1 "Space Grotesk",Inter,sans-serif;padding:0 12px}
.side nav{display:flex;flex-direction:column;gap:4px}
.side nav button{min-height:40px;padding:0 12px;border:0;border-radius:8px;background:none;text-align:left;font-size:14px;font-weight:600}
.side nav button.on{background:var(--sel);color:var(--selfg)}

let dragSplit = null;
const setSplit = (el, pct) => { S.ui.split = Math.round(Math.max(25, Math.min(75, pct)) * 10) / 10; el.previousElementSibling.style.flex = '0 1 ' + S.ui.split + '%'; };
document.addEventListener('pointerdown', (e) => { const s = e.target.closest && e.target.closest('.split'); if (!s) return; e.preventDefault(); dragSplit = s; document.body.style.userSelect = 'none'; });
document.addEventListener('pointermove', (e) => { if (!dragSplit) return; const box = dragSplit.parentElement.getBoundingClientRect(); setSplit(dragSplit, (e.clientX - box.left) / box.width * 100); });
['pointerup', 'pointercancel'].forEach((n) => document.addEventListener(n, () => { if (!dragSplit) return; dragSplit = null; document.body.style.userSelect = ''; save(); }));
document.addEventListener('keydown', (e) => { if (!e.target.classList || !e.target.classList.contains('split') || (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight')) return; e.preventDefault(); setSplit(e.target, S.ui.split + (e.key === 'ArrowLeft' ? -2 : 2)); save(); });
let wasWide = wide();
window.addEventListener('resize', () => { if (wide() !== wasWide) { wasWide = wide(); render(); } });

/* ---------- sync with the sheet ---------- */

let syncTimer = 0, again = false;
function queueSync() { clearTimeout(syncTimer); syncTimer = setTimeout(sync, 1500); }
async function sync() {
  if (!S.conn.url || parked) return;
  if (S.busy) { again = true; return; }
  S.busy = true; again = false;
  // A reply that comes back after this copy was covered, or after it was picked again and re-read its state, belongs to a state no longer in use and is dropped.
  const me = S, stale = () => parked || S !== me;
  const ids = Object.keys(S.dirty), sent = ids.map(taskById).filter(Boolean), stamp = {};
  sent.forEach((t) => { stamp[t.id] = t.updated; });
  const rd = Object.assign({}, S.rDirty), nr = S.newRules.slice(), evSent = {};
  Object.keys(S.evEdits).forEach((id) => { evSent[id] = JSON.stringify(S.evEdits[id]); });
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 30000);
  try {
    const res = await fetch(S.conn.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, signal: ctl.signal,
      body: JSON.stringify({ key: S.conn.key, action: 'sync', v: VERSION, tasks: sent, routines: Object.keys(rd).map((id) => ({ id: id, next: rd[id] })), rules: nr,
        events: Object.keys(evSent).map((k) => JSON.parse(evSent[k])) }) });
    let j;
    try { j = await res.json(); } catch (e) { throw new Error('The sheet answered with something unexpected. Check the connection code.'); }
    if (!j.ok) throw new Error(j.auth ? 'The key was refused. Paste the connection code again.' : (j.error || 'The sheet refused the request.'));
    if (stale()) return;
    applySync(j.data, stamp, rd, nr, evSent);
    S.err = '';
  } catch (e) {
    if (!stale()) S.err = e.name === 'AbortError' ? 'The sheet took too long to answer.' : !navigator.onLine ? 'This device is offline.' : e.name === 'TypeError' ? 'The web app did not answer. Check that the code starts with the Web app URL from Deploy > Manage deployments and that its access is Anyone.' : (e.message || 'Could not reach the sheet.');
  } finally {
    clearTimeout(timer); me.busy = false;
    if (!stale()) { save(); softRender(); if (again && !S.err) queueSync(); }
  }
}
function applySync(d, stamp, rd, nr, evSent) {
  const local = {};
  S.tasks.forEach((t) => { local[t.id] = t; });
  const seen = {}, out = [];
  (d.tasks || []).forEach((srv) => {
    seen[srv.id] = true;
    const mine = local[srv.id];
    // A task changed on this device while the request was in flight stays as it is here and goes up at the next sync.
    if (mine && S.dirty[srv.id] && mine.updated !== stamp[srv.id]) { if (srv.eventId && !mine.eventId) mine.eventId = srv.eventId; out.push(mine); return; }
    delete S.dirty[srv.id];
    out.push(srv);
  });
  S.tasks.forEach((t) => { if (!seen[t.id] && S.dirty[t.id] && t.updated !== stamp[t.id]) out.push(t); else if (!seen[t.id]) delete S.dirty[t.id]; });
  S.tasks = out;
  S.routines = (d.routines || []).map((r) => (S.rDirty[r.id] && S.rDirty[r.id] !== rd[r.id] ? Object.assign({}, r, { next: S.rDirty[r.id] }) : r));
  Object.keys(rd).forEach((id) => { if (S.rDirty[id] === rd[id]) delete S.rDirty[id]; });
  S.newRules = S.newRules.filter((r) => nr.indexOf(r) < 0);
  S.rules = (d.rules || []).concat(S.newRules);
  S.words = d.words || S.words;
  S.settings = Object.assign({ stale: 14, prio: 2, history: 90 }, d.settings || {});
  const openEv = eventOf();
  S.events = d.events || [];
  keyEvents();
  // An event changed again while the request was in flight keeps that change on screen and sends it next time.
  Object.keys(evSent || {}).forEach((k) => { if (JSON.stringify(S.evEdits[k]) === evSent[k]) delete S.evEdits[k]; });
  S.events.forEach((e) => { const x = S.evEdits[e.key]; if (x) ['t', 'date', 'time', 'end'].forEach((f) => { if (x[f] != null) e[f] = x[f]; }); });
  // The event whose details are open keeps them open after it moved to a new day or time.
  if (openEv && !eventOf()) { const again = S.events.filter((e) => e.id === openEv.id && e.date === openEv.date && (e.time || '') === (openEv.time || ''))[0]; S.ui.ev = again ? again.key : ''; }
  S.backend = d.version || '';
  S.warn = (d.warn || []).slice();
  if (parseInt(S.backend, 10) !== BACKEND_MAJOR) S.warn.push('The sheet runs script ' + S.backend + ', and this app needs ' + BACKEND_MAJOR + '.x. Paste the current Code.gs into the sheet and publish a new version.');
  // A task that reached the sheet with its Domain or Where left blank gets the blank filled from this device's keyword rules, still marked as a guess.
  let filled = false;
  S.tasks.forEach((t) => {
    if (t.status !== 'open' || !/^Inbox:/.test(t.src || '')) return;
    const g = guess(t.t), patch = { src: 'Claude', updated: new Date().toISOString() };
    if (t.src.indexOf('d', 6) >= 0) patch.dom = g.dom;
    if (t.src.indexOf('w', 6) >= 0) patch.wh = t.buy && g.wh !== 'Phone' ? 'Out' : g.wh;
    Object.assign(t, patch); S.dirty[t.id] = true; filled = true;
  });
  if (filled) again = true;
  S.lastSync = new Date().toISOString();
  if (S.ui.detail && !taskById(S.ui.detail)) S.ui.detail = '';
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) { softRender(); sync(); } });
window.addEventListener('online', sync);
setInterval(() => { if (!document.hidden) sync(); }, 300000);

// Copies that share this browser's storage (a tab, the installed app, the tab in Team HQ) would overwrite each other's saved state,
// so the copy opened last does the work and an older copy waits behind a cover until it is picked again.
const peers = 'BroadcastChannel' in window ? new BroadcastChannel('docket') : null;
if (peers) { peers.onmessage = (e) => { if (e.data === 'open' && !parked) { parked = true; clearTimeout(syncTimer); render(); } }; peers.postMessage('open'); }
function unpark() { parked = false; S = loadState(); keyEvents(); if (peers) peers.postMessage('open'); sync(); }
render();
sync();
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
